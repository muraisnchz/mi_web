name: Mi Primer Pipeline
on: [push]
jobs:
  construir_y_subir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir la imagen
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mi_web .

      - name: Empujar a Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mi_web